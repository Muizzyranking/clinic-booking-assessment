[project]
name = "clinic-booking"
version = "0.1.0"
description = "Clinic appointment booking API (FastAPI + SQLite)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.110",
    "pydantic-settings>=2.16.2",
    "uvicorn[standard]>=0.29",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.4",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "C4", "PT"]

[tool.pytest.ini_options]
testpaths = ["tests"]
